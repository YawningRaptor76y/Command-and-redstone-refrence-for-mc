<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedrock Command Reference</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <h1>// CMD REF</h1>
    <span class="badge"><span id="section-badge"></span></span>
    <select id="section-select"></select>
  </div>
  <div class="search-row">

  <div class="filter-row" id="filter-row"></div>
</header>

<div class="layout">
  <aside id="aside"><div class="aside-label">Index</div></aside>
  <main id="main"><div id="no-results">// NO MATCHES FOUND</div></main>
</div>

<script src="core.js"></script>

</html>
